<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>文明帝國 VII — 上古遺產</title>
<meta name="description" content="一款回合制 3D 策略史詩。建立帝國、統帥軍團，帶領子民從上古時代走向傳奇。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1a26'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e3bd74'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./assets/fonts/fonts.css" />
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<svg id="sprite" aria-hidden="true">
  <defs>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9b0"/><stop offset="45%" stop-color="#e7c073"/><stop offset="100%" stop-color="#9c6d2c"/>
    </linearGradient>
    <linearGradient id="parch-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ead1"/><stop offset="100%" stop-color="#d8c39a"/>
    </linearGradient>
    <symbol id="i-science" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5.4 18.2A2 2 0 0 0 7.2 21h9.6a2 2 0 0 0 1.8-2.8L14 9V3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.4 15h9.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10.4" cy="17.6" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-culture" viewBox="0 0 24 24"><path d="M4 4c3 1.2 5 3.4 5 6.6V20M20 4c-3 1.2-5 3.4-5 6.6V20M4 5h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 20h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-gold" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".7"/><path d="M12 6.6v10.8M6.6 12h10.8" stroke="currentColor" stroke-width="1" opacity=".5"/></symbol>
    <symbol id="i-faith" viewBox="0 0 24 24"><path d="M12 2.6l2.3 6.1 6.4.3-5 4 1.8 6.3L12 15.7 6.5 19.3l1.8-6.3-5-4 6.4-.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-influence" viewBox="0 0 24 24"><path d="M4 20V5.5C4 4.7 4.7 4 5.5 4H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M19 4l-2.4 3.2L19 10.4h-6.6l-2-3.2 2-3.2z" fill="currentColor" opacity=".85"/><path d="M8.5 20h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M12 21V9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12c-3.2 0-5.2-2-5.2-5.2C10 6.8 12 8.9 12 12zM12 12c3.2 0 5.2-2 5.2-5.2C14 6.8 12 8.9 12 12zM12 16c-3.2 0-5.2-2-5.2-5.2C10 10.8 12 12.9 12 16zM12 16c3.2 0 5.2-2 5.2-5.2C14 10.8 12 12.9 12 16z" fill="currentColor"/></symbol>
    <symbol id="i-production" viewBox="0 0 24 24"><path d="M12 2.8l7.6 4.4v9L12 20.6 4.4 16.2V7.2z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7.2l3.8 2.2v4.4L12 16l-3.8-2.2V9.4z" fill="currentColor" opacity=".8"/></symbol>
    <symbol id="i-pop" viewBox="0 0 24 24"><circle cx="9" cy="8.4" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 20c.4-3.4 2.6-5.4 5.5-5.4s5.1 2 5.5 5.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="16.6" cy="9.4" r="2.3" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".8"/><path d="M15 14.9c2.6-.5 4.7 1 5.3 4.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".8"/></symbol>
    <symbol id="i-strength" viewBox="0 0 24 24"><path d="M5 19l3.2-3.2M6 5.5l12.5 12.5M15.5 4L20 4 20 8.5 8.5 20 4 15.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-defense" viewBox="0 0 24 24"><path d="M12 2.8l7.4 2.6v6c0 4.4-3 7.7-7.4 9.8-4.4-2.1-7.4-5.4-7.4-9.8v-6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 6.4v10.4" stroke="currentColor" stroke-width="1.3" opacity=".7"/></symbol>
    <symbol id="i-hp" viewBox="0 0 24 24"><path d="M12 20.4S3.6 15.6 3.6 9.6A4.6 4.6 0 0 1 12 6.9a4.6 4.6 0 0 1 8.4 2.7c0 6-8.4 10.8-8.4 10.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M12 3l-3.4 3.4M12 3l3.4 3.4M12 21l-3.4-3.4M12 21l3.4-3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-city" viewBox="0 0 24 24"><path d="M4 21V9l4-3v15M12 21V4l8 5v12M3 21h18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 12h1M15 12h2M15 15h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-research" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14.4 3v4.2H18.6M9 12h6M9 15.6h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-kills" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.3l6.1-.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-wonder" viewBox="0 0 24 24"><path d="M3 20l9-16 9 16z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 20l3.5-6 3.5 6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".7"/></symbol>
    <symbol id="i-settle" viewBox="0 0 24 24"><path d="M12 21V6M12 6l6 3v6M12 6L6 9v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 5l8 7-8 7zM17 5v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-sleep" viewBox="0 0 24 24"><path d="M14 3a8 8 0 1 0 7 11.7A6.4 6.4 0 0 1 14 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-fortify" viewBox="0 0 24 24"><path d="M4 20v-9l8-7 8 7v9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 13h16M9 20v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-turn" viewBox="0 0 24 24"><path d="M6 3h12M7 3v3.2L12 11l5-4.8V3M6 21h12M7 21v-3.2L12 13l5 4.8V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-attack" viewBox="0 0 24 24"><path d="M4 20l7-7M11 13l7-9 2 2-9 7M9 8l3-3 2 2-3 3M13 12l3 3-3 2-2-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l4 4M14.6 18.4l3.6 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <canvas id="scene"></canvas>
  <div id="scene-fx"></div>

  <div id="hud">
    <header id="topbar">
      <div class="brand">
        <div class="crest" id="player-crest"></div>
        <div class="brand-text">
          <div class="civ-name" id="player-civ">奧蕾莉亞</div>
          <div class="leader-line">
            <span id="player-leader">奧蕾莉亞女皇</span>
            <span class="sep">•</span>
            <span class="age" id="player-age">上古時代</span>
          </div>
        </div>
      </div>
      <div class="resources" id="resource-bar"></div>
      <button id="open-gm" class="council-btn" title="GM 平台：即時調整文明、公式與世界（F12 / G）">
        <svg class="ic"><use href="#i-production"/></svg><span>GM</span>
      </button>
      <button id="open-options" class="council-btn" title="系統選項：語言、音訊與顯示（Esc）">
        <svg class="ic"><use href="#i-wonder"/></svg><span>選項</span>
      </button>
      <button id="open-council" class="council-btn" title="帝國議會：天時、軍團、名將、未來、危機與劇本（M）">
        <svg class="ic"><use href="#i-culture"/></svg><span>議會</span>
      </button>
      <div class="turn-clock">
        <div class="era-chip" id="era-chip">上古時代</div>
        <div class="turn-label">回合 <b id="turn-number">1</b></div>
      </div>
    </header>

    <aside id="left-rail">
      <section class="card research-card" id="research-card">
        <div class="card-head"><svg class="ic"><use href="#i-research"/></svg><span>研究</span><b id="science-per-turn">+0</b></div>
        <div class="research-body">
          <div class="tech-name" id="current-tech">陶器</div>
          <div class="progress"><div class="progress-fill" id="tech-progress"></div><span class="progress-label" id="tech-turns">—</span></div>
          <div class="tech-blurb" id="tech-blurb">—</div>
        </div>
        <button class="ghost-btn" id="open-tech">檢視科技樹 <kbd>T</kbd></button>
      </section>
      <section class="card objective-card" id="objective-card">
        <div class="card-head"><svg class="ic"><use href="#i-wonder"/></svg><span>傳承之路</span></div>
        <div class="objective-title">最初的城邦</div>
        <ul class="objective-list" id="objective-list"></ul>
      </section>
    </aside>

    <aside id="right-rail">
      <div class="card minimap-card">
        <div class="minimap-frame"><canvas id="minimap" width="236" height="150"></canvas><div class="minimap-compass">N</div></div>
        <div class="world-status">
          <span id="weather-status">風：微風</span>
          <span id="climate-status">排放 0</span>
          <span id="crisis-status">天下太平</span>
        </div>
        <div class="minimap-foot">
          <span id="minimap-coords">六角格 —</span>
          <span class="minimap-legend"><i class="dot you"></i>你 <i class="dot foe"></i>對手</span>
        </div>
      </div>
      <div class="leaders-card" id="leaders-card"></div>
    </aside>

    <div id="action-hint">正在載入世界…</div>
    <div id="toasts"></div>
    <div id="tooltip" class="hidden"></div>

    <section id="selection-panel" class="hidden"></section>
    <div id="command-bar" class="hidden"></div>
    <button id="end-turn" title="結束回合（空白鍵）">
      <span class="ring"></span>
      <span class="hourglass"><svg><use href="#i-turn"/></svg></span>
      <span class="label">結束<br/><b>回合</b></span>
    </button>
    <div id="turn-banner" class="hidden"></div>
    <div id="modals"></div>
  </div>

  <div id="loading-screen">
    <div class="load-inner">
      <div class="load-mark">VII</div>
      <div class="load-title">文明帝國</div>
      <div class="load-sub">正在開創嶄新世界…</div>
      <div class="load-bar"><i></i></div>
    </div>
  </div>
</div>

<noscript><p style="color:#fff;font:16px sans-serif;padding:2rem">本體驗需要啟用 JavaScript。</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
