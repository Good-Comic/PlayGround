services:
  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:1.29.0
    profiles: ["agent"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./workspace:/projects
      - ./state:/home/openhands/.openhands
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped

  forge-studio:
    build:
      context: ./server
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FORGE_DB_PATH: /data/forge.db
      FORGE_WORKSPACE_ROOT: /workspace
      FORGE_TASK_ROOT: /data/agent-tasks
      FORGE_OPENAI_API_KEY:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/workspace:ro
      - forge-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  forge-data:
